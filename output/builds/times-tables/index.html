<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Tables Practice</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #1d2433;
    --muted: #5b6577;
    --line: #dfe5ee;
    --accent: #3b6ef5;
    --good: #17864b;
    --good-bg: #e6f6ec;
    --bad: #c02a35;
    --bad-bg: #fdeaec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b2029;
      --ink: #eaeef6;
      --muted: #a3adbf;
      --line: #2c3340;
      --accent: #7ea1ff;
      --good: #6ee7a4;
      --good-bg: #10331f;
      --bad: #ff9aa3;
      --bad-bg: #3a1519;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
  }

  .question {
    font-size: clamp(2.6rem, 13vw, 3.8rem);
    font-weight: 700;
    text-align: center;
    letter-spacing: 2px;
    margin: 6px 0 18px;
    font-variant-numeric: tabular-nums;
  }

  form { display: flex; gap: 10px; }

  input[type="number"] {
    flex: 1;
    min-width: 0;
    font-size: 2rem;
    font-family: inherit;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: transparent;
    color: var(--ink);
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border-radius: 12px;
    border: 1px solid transparent;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
  }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    font-size: 0.9rem;
    padding: 8px 14px;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .feedback {
    margin-top: 16px;
    min-height: 3.1em;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 1.05rem;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: transparent;
    color: var(--muted);
  }
  .feedback.correct { background: var(--good-bg); color: var(--good); font-weight: 600; }
  .feedback.wrong { background: var(--bad-bg); color: var(--bad); font-weight: 600; }

  .scoreboard {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 460px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
  }
  .stat .value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 460px;
    width: 100%;
    color: var(--muted);
    font-size: 0.9rem;
  }
  select {
    font: inherit;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
  }
</style>
</head>
<body>
  <h1>Times Tables Practice</h1>

  <div class="card">
    <div class="question" id="question" aria-live="polite">7 × 8</div>

    <form id="answer-form">
      <input
        id="answer"
        type="number"
        inputmode="numeric"
        autocomplete="off"
        placeholder="?"
        aria-label="Your answer"
        required>
      <button type="submit" id="check-btn">Check</button>
    </form>

    <div class="feedback" id="feedback" role="status" aria-live="polite">
      Type your answer and press Enter.
    </div>
  </div>

  <div class="scoreboard">
    <div class="stat"><div class="value" id="stat-correct">0</div><div class="label">Correct</div></div>
    <div class="stat"><div class="value" id="stat-asked">0</div><div class="label">Asked</div></div>
    <div class="stat"><div class="value" id="stat-streak">0</div><div class="label">Streak</div></div>
  </div>

  <div class="controls">
    <label for="table-select">Practice:</label>
    <select id="table-select">
      <option value="all">All tables (1–9)</option>
    </select>
    <button class="secondary" id="reset-btn" type="button">Reset score</button>
  </div>

<script>
(function () {
  const MIN = 1, MAX = 9;

  const questionEl = document.getElementById('question');
  const formEl = document.getElementById('answer-form');
  const answerEl = document.getElementById('answer');
  const checkBtn = document.getElementById('check-btn');
  const feedbackEl = document.getElementById('feedback');
  const tableSelect = document.getElementById('table-select');
  const resetBtn = document.getElementById('reset-btn');
  const stats = {
    correct: document.getElementById('stat-correct'),
    asked: document.getElementById('stat-asked'),
    streak: document.getElementById('stat-streak')
  };

  for (let n = MIN; n <= MAX; n++) {
    const opt = document.createElement('option');
    opt.value = String(n);
    opt.textContent = n + ' times table';
    tableSelect.appendChild(opt);
  }

  let score = { correct: 0, asked: 0, streak: 0 };
  let current = null;        // { a, b, answer }
  let awaitingNext = false;  // true while showing feedback for an answered question

  const randInt = (min, max) => min + Math.floor(Math.random() * (max - min + 1));

  function newQuestion() {
    const fixed = tableSelect.value === 'all' ? null : Number(tableSelect.value);
    let a = fixed === null ? randInt(MIN, MAX) : fixed;
    let b = randInt(MIN, MAX);
    // For a fixed table, vary which side the chosen number appears on.
    if (fixed !== null && Math.random() < 0.5) { const t = a; a = b; b = t; }

    // Avoid repeating the exact same question twice in a row.
    if (current && current.a === a && current.b === b) return newQuestion();

    current = { a: a, b: b, answer: a * b };
    questionEl.textContent = a + ' × ' + b;
    answerEl.value = '';
    answerEl.focus();
  }

  function render() {
    stats.correct.textContent = score.correct;
    stats.asked.textContent = score.asked;
    stats.streak.textContent = score.streak;
  }

  function setFeedback(text, kind) {
    feedbackEl.textContent = text;
    feedbackEl.className = 'feedback' + (kind ? ' ' + kind : '');
  }

  function moveToNext() {
    awaitingNext = false;
    checkBtn.textContent = 'Check';
    setFeedback('Type your answer and press Enter.', '');
    newQuestion();
  }

  function checkAnswer() {
    const raw = answerEl.value.trim();
    if (raw === '') {
      setFeedback('Type a number first.', '');
      answerEl.focus();
      return;
    }

    const given = Number(raw);
    if (!Number.isInteger(given)) {
      setFeedback('Whole numbers only, please.', '');
      answerEl.focus();
      return;
    }

    score.asked++;
    if (given === current.answer) {
      score.correct++;
      score.streak++;
      setFeedback('Correct! ' + current.a + ' × ' + current.b + ' = ' + current.answer, 'correct');
    } else {
      score.streak = 0;
      setFeedback('Not quite. ' + current.a + ' × ' + current.b + ' = ' + current.answer +
                  ' (you said ' + given + ')', 'wrong');
    }
    render();

    awaitingNext = true;
    checkBtn.textContent = 'Next';
    answerEl.select();
  }

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    if (awaitingNext) moveToNext();
    else checkAnswer();
  });

  tableSelect.addEventListener('change', function () {
    awaitingNext = false;
    checkBtn.textContent = 'Check';
    setFeedback('Type your answer and press Enter.', '');
    newQuestion();
  });

  resetBtn.addEventListener('click', function () {
    score = { correct: 0, asked: 0, streak: 0 };
    render();
    answerEl.focus();
  });

  render();
  newQuestion();
})();
</script>
</body>
</html>
